apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.Name }}
  namespace: {{ .Values.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Values.Name }}-app
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 0
      containers:
        - name: {{ .Values.Name }}-app-container
          image: {{ .Values.Image }}
          ports:
            - containerPort: {{ .Values.ContainerPort }}
          env:
{{- with .Values.env }}
{{ toYaml . | indent 12 }}
{{- end }}
          volumeMounts:
            - name: {{ .Values.Name }}-volv
              mountPath: {{ .Values.MountPath }}
      volumes:
        - name: {{ .Values.Name }}-volv
          persistentVolumeClaim:
            claimName: {{ .Values.Name }}-nfs-claim
{{- if and .Values.esoSecret.secretName .Values.esoSecret.storeName }}
envFrom:
  - secretRef:
      name: {{ .Values.esoSecret.secretName }}
{{- end }}