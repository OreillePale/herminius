apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.Name }}-nfs-claim
  namespace: {{ .Values.Namespace }}
spec:
  storageClassName: slow
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.Storage }}
  selector:
    matchLabels:
      directory: {{ .Values.Name }}