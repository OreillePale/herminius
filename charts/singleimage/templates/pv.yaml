apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.Name }}-nfs-volume
  namespace: {{ .Values.Namespace }}
  labels:
    directory: {{ .Values.Name }}
spec:
  capacity:
    storage: {{ .Values.Storage }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: nfs-csi
  nfs:
    path: {{ .Values.Path }}
    server: 10.43.0.4