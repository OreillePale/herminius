apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.10.1  # latest ARM64-compatible version
    helm:
      values: |
        service:
          ui:
            type: NodePort
            nodePort: 30080
        # Disable risky pre-delete job to prevent uninstall issues
        preDeleteJob:
          enabled: false
        # Default disk path for automatic node disk detection
        defaultSettings:
          defaultDataPath: "/var/lib/longhorn"
        # Optional: allow auto-upgrade of minor versions
        upgrade:
          autoUpgrade: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
