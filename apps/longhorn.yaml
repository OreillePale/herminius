apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: v1.10.1
      helm:
        values: |
          preUpgradeChecker:
            jobEnabled: false

          service:
            ui:
              type: NodePort
              nodePort: 30500

          ingress:
            enabled: true
            hosts:
              - host: longhorn.local
                paths:
                  - path: /
                    pathType: Prefix
            tls: []

          # Do NOT create Longhorn's default StorageClass
          persistence:
            defaultClass: false

          # Fallback default replica count (only used if a SC doesn't specify one)
          defaultSettings:
            defaultReplicaCount: 2

          # Custom StorageClasses
          extraObjects:
            - apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-single
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Retain
              parameters:
                numberOfReplicas: "1"

            - apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: longhorn-double
                annotations:
                  storageclass.kubernetes.io/is-default-class: "true"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Retain
              parameters:
                numberOfReplicas: "2"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
