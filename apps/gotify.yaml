apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gotify
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pmoscode-helm.github.io/gotify
    chart: gotify
    targetRevision: "0.7.0"
    helm:
      values: |
          persistentVolume:
            enabled: true
            size: 2Gi
            storageClass: longhorn-double
        
  destination:
    server: https://kubernetes.default.svc
    namespace: gotify
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
