apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default

  source:
    repoURL: pajikos.github.io/home-assistant-helm-chart/
    chart: home-assistant
    targetRevision: v0.3.41
    helm:
      values: |
        controller:
          type: StatefulSet
        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: longhorn

  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
