controllers:
  grimmory:
    containers:
      app:
        image:
          repository: grimmory/grimmory
          tag: "v2.2.1"
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: Etc/UTC
          - name: DATABASE_URL
            value: jdbc:mariadb://mariadb.grimmory.svc.cluster.local:3306/grimmory
          - name: DATABASE_USERNAME
            value: grimmory
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_PASSWORD

  mariadb:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/mariadb
          tag: "11.4.5"
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: Etc/UTC
          - name: MYSQL_DATABASE
            value: grimmory
          - name: MYSQL_USER
            value: grimmory
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: DB_PASSWORD
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secret
                key: ROOT_PASSWORD

service:
  app:
    controller: grimmory
    ports:
      http:
        port: 6060
        targetPort: 6060

  mariadb:
    controller: mariadb
    ports:
      db:
        port: 3306
        targetPort: 3306

persistence:
  mariadb-config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 5Gi
    globalMounts:
      - path: /config

  grimmory-data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 5Gi
    globalMounts:
      - path: /config

  grimmory-books:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: nfs-subdir
    size: 10Gi
    globalMounts:
      - path: /books

  grimmory-bookdrop:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: nfs-subdir
    size: 2Gi
    globalMounts:
      - path: /bookdrop
