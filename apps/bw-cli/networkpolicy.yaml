apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-to-bitwarden-cli
  namespace: bitwarden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-cli
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets
