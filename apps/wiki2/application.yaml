apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wiki2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OreillePale/herminius
    targetRevision: HEAD
    path: charts/singleimage
    helm:
      - ../../apps/wiki2/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wiki2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true