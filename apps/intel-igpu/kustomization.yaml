apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: intel-device-plugins-operator
    repo: https://intel.github.io/helm-charts
    version: 0.37.1
    releaseName: device-plugin-operator
    namespace: intel-igpu
    includeCRDs: true
    valuesInline:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "reserved"
          effect: "NoSchedule"

  - name: intel-device-plugins-gpu
    repo: https://intel.github.io/helm-charts
    version: 0.37.1
    releaseName: gpu-device-plugin
    namespace: intel-igpu
    valuesInline:
      sharedDevNum: 4
      nodeFeatureRule: false
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "reserved"
          effect: "NoSchedule"

patches:
  - target:
      group: deviceplugin.intel.com
      kind: GpuDevicePlugin
    patch: |-
      apiVersion: deviceplugin.intel.com/v1
      kind: GpuDevicePlugin
      metadata:
        name: ignored
        annotations:
          argoproj.io/sync-wave: "1"
