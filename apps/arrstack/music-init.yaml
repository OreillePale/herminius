apiVersion: v1
kind: Pod
metadata:
  name: create-music-folder
  namespace: arrstack
spec:
  restartPolicy: Never

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  containers:
    - name: create-folder
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /media/music
          echo "Created /media/music"
          ls -la /media
          sleep 30

      volumeMounts:
        - name: media
          mountPath: /media

  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: media2
