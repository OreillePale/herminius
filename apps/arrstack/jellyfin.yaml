apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: "3.2.0"
    helm:
      values: |
        replicaCount: 1
        nodeSelector:
          kubernetes.io/hostname: workertn
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "reserved"
            effect: "NoSchedule"
        podSecurityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
          supplementalGroups:
            - 992
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            add: ["SYS_ADMIN"]
            drop: ["ALL"]
          privileged: false
        env:
          - name: LIBVA_DRIVER_NAME
            value: iHD
          - name: LIBVA_DRIVERS_PATH
            value: /usr/lib/jellyfin-ffmpeg/lib/dri
        volumes:
          - name: hwa
            hostPath:
              path: /dev/dri
        volumeMounts:
          - name: hwa
            mountPath: /dev/dri
        persistence:
          config:
            enabled: true
            size: 10Gi
            storageClass: local-path
            accessModes:
              - ReadWriteMany
          media:
            enabled: true
            existingClaim: media2
          backups:
            enabled: true
            size: 2Gi
            storageClass: nfs-subdir
            mountPath: /config/data/backups
            accessMode: ReadWriteOnce
  destination:
    server: https://kubernetes.default.svc
    namespace: arrstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
