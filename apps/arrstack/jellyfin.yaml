apiVersion: v1
kind: PersistentVolume
metadata:
  name: smb-media-pv
spec:
  capacity:
    storage: 100Gi   # placeholder
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: smb-media-pv          # <-- REQUIRED!
    readOnly: false
    volumeAttributes:
      source: "//192.168.1.23/shared"
      mountOptions: "vers=3.0,guest,username="
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-media-pvc
  namespace: arrstack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: smb-media-pv
  storageClassName: ""
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: "2.7.0"
    helm:
      values: |
        persistence:
          config:
            enabled: true
            size: 10Gi
            storageClass: longhorn-double
          data:
            enabled: true
            size: 10Gi
            storageClass: longhorn-double
          # Mount the SMB media PVC like other volumes
          media:
            enabled: true
            existingClaim: smb-media-pvc
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        service:
          type: NodePort
          nodePort: 32000
  destination:
    server: https://kubernetes.default.svc
    namespace: arrstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
