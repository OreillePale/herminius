apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: "2.7.0"
    helm:
      values: |
        persistence:
          config:
            enabled: true
            size: 10Gi
            storageClass: nfs-subdir
          data:
            enabled: true
            existingClaim: media
          media:
            enabled: true
            existingClaim: media
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        service:
          type: NodePort
          nodePort: 32000
  destination:
    server: https://kubernetes.default.svc
    namespace: arrstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
