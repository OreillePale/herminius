apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: "2.7.0"
    helm:
      values: |
        podSecurityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
    
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
    
        persistence:
          config:
            enabled: true
            size: 10Gi
            storageClass: nfs-subdir
            accessModes:
              - ReadWriteMany
    
          media:
            enabled: true
            existingClaim: media

    service:
      type: NodePort
      nodePort: 32000
  destination:
    server: https://kubernetes.default.svc
    namespace: arrstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
