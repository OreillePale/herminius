apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: "2.7.0"
    helm:
      values: |
        persistence:
          config:
            enabled: true
            size: 10Gi
            storageClass: longhorn-double
          data:
            enabled: true
            size: 10Gi
            storageClass: longhorn-double
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        extraVolumes:
          - name: smb-media
            csi:
              driver: smb.csi.k8s.io
              readOnly: false
              volumeAttributes:
                source: "//192.168.1.23/shared/data/media"
                mountOptions: "vers=3.0,guest"
        extraVolumeMounts:
          - name: smb-media
            mountPath: /media
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: arrstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
