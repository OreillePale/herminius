controllers:
  soularr:
    initContainers:
      config:
        image:
          repository: alpine
          tag: "3.22"

        env:
          - name: LIDARR_API_KEY
            valueFrom:
              secretKeyRef:
                name: slskd-secret
                key: LIDARR_API_KEY

          - name: SLSKD_API_KEY
            valueFrom:
              secretKeyRef:
                name: slskd-secret
                key: SLSKD_API_KEY

        command:
          - /bin/sh
          - -c
          - |
            echo "installing crudini"
            apk add --no-cache crudini

            echo "updating .ini keys"
            crudini --set --existing /data/config.ini Lidarr api_key "$LIDARR_API_KEY"
            crudini --set --existing /data/config.ini Slskd api_key "$SLSKD_API_KEY"
            
    containers:
      app:
        image:
          repository: mrusse08/soularr
          tag: "1.2.2"
        env:
          SCRIPT_INTERVAL: 300
          TZ: "ETC/UTC"
          PGID: 1000
          PUID: 1000
        envFrom:
          - secretRef:
              name: slskd-secret

      
          
persistence:
  data:
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 500Mi
    advancedMounts:
      soularr:
        data:
          - path: /data

  media:
    type: persistentVolumeClaim
    existingClaim: media2
    advancedMounts:
      soularr:
        app:
          - path: /downloads
            subPath: download/slskd

