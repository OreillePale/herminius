apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cluster0-backup
  namespace: nativecloudpg
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: cluster0
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: cluster0-initial2
  namespace: nativecloudpg
spec:
  method: barmanObjectStore
  cluster:
    name: cluster0
