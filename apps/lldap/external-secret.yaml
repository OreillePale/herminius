apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-secret
  namespace: lldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-fields-wrapped
    kind: ClusterSecretStore
  target:
    name: lldap-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: 67c36ae3-94cb-4fe7-8c77-b4070114195
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
