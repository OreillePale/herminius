controllers:
  voidauth:
    containers:
      app:
        image:
          repository: voidauth/voidauth
          tag: "1.10.0"
        env:
          DB_HOST: cluster0-rw.nativecloudpg.svc.cluster.local
          APP_URL: "https://voidauth.flickers.cc" 
        envFrom:
          - secretRef:
              name: voidauth-secret
              
service:
  app:
    controller: voidauth
    ports:
      http:
        port: 3000
        targetPort: 3000
