controllers:
  voidauth:
    containers:
      app:
        image:
          repository: voidauth/voidauth
          tag: "1.15.1"
        env:
          DB_HOST: cluster0-rw.nativecloudpg.svc.cluster.local
          DB_USER: voidauth
          DB_NAME: voidauth
          APP_URL: "https://voidauth.flickers.cc" 
        envFrom:
          - secretRef:
              name: voidauth-secret
              
service:
  app:
    controller: voidauth
    ports:
      http:
        port: 3000
        targetPort: 3000
      ldap:
        port: 3890
        targetPort: 3890
