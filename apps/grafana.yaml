apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://k8s-home-lab.github.io/helm-charts/
    chart: radarr
    targetRevision: "10.5.15"
    helm:
      values: |
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: longhorn-double
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      serverSideApply: true
      createNamespace: true
