apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: beszel-agent
  namespace: beszel
spec:
  selector:
    matchLabels:
      app: beszel-agent
  template:
    metadata:
      labels:
        app: beszel-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet #AI black magic, why ?
      containers:
      - env:
        - name: PORT
          value: "45876"
        - name: HUB_URL
          value: "http://beszel-server.beszel.svc.cluster.local:8090"
        - name: SYSTEM_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
          - secretRef:
              name: hub-secret
        image: henrygd/beszel-agent:0.18.7-alpine
        imagePullPolicy: Always
        name: beszel-agent
        ports:
          - containerPort: 45876
            hostPort: 45876
      restartPolicy: Always
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: reserved
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
