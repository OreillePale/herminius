apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:pg16-v0.4.3

  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: postgres-cred

  storage:
    size: 1Gi

  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg16-v0.4.3
        dynamic_library_path:
          - /usr/lib/postgresql/16/lib
        extension_control_path:
          - /usr/share/postgresql/16/

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: immich
spec:
  cluster:
    name: immich-database
  name: immich
  owner: immich
  extensions:
    - name: vchord
      ensure: present
