apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.22-1.1.1 #ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: postgres-cred
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: immich
spec:
  cluster:
    name: immich-database
  name: immich
  owner: immich
  extensions:
    - name: vchord
      ensure: present
