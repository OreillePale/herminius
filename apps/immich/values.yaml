controllers:
  main:
    containers:
      main:
        env:
          REDIS_HOSTNAME: "redis.redis.svc.cluster.local"
          REDIS_PORT: "6379"
          DB_HOSTNAME: "immich-database-rw.immich.svc.cluster.local"
          DB_USERNAME: "immich"
          DB_DATABASE_NAME: "immich"
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgres-cred
                key: POSTGRES_PASSWORD

immich:
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: false

server:
  ingress:
    main:
      enabled: false
