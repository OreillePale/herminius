apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autobrr
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/OreillePale/herminius
    targetRevision: main
    path: apps/autobrr
    kustomize:
      buildOptions: --enable-helm

  destination:
    server: https://kubernetes.default.svc
    namespace: autobrr

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
