apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smb-csi-driver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-csi/csi-driver-smb
    targetRevision: master
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
