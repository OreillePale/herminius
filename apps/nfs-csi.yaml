apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    chart: csi-driver-nfs
    targetRevision: 4.13.1
    helm:
      values: |
        controller:
          runOnControlPlane: true
        storageClass:
          name: nfs-subdir
          defaultClass: true
          allowVolumeExpansion: true
        pv:
          reclaimPolicy: Retain
        pvc:
          subdirectoryPattern: "{{ .PVC.Namespace }}-{{ .PVC.Name }}"  # human-readable folders
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
