apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-csi.github.io/csi-driver-nfs
    chart: nfs-csi-driver
    targetRevision: 4.6.0  # or latest
    helm:
      values: |
        controller:
          runOnControlPlane: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true