apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "28.9.0"
    helm:
      values: |
        # Set global scrape settings at the server level
        server:
          global:
            scrape_interval: 1m
            scrape_timeout: 50s
            evaluation_interval: 1m
          
          # Data retention set to 5 days
          retention: "5d"
          
          persistentVolume:
            enabled: true
            size: 8Gi
            storageClass: longhorn-single
          
          # Additional flags to reduce resource consumption
          extraFlags:
            - web.enable-lifecycle
            - storage.tsdb.wal-compression
            - query.max-samples=50000000
          
          # Resource limits
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
        
        alertmanager:
          enabled: true
        
        kubeStateMetrics:
          enabled: false
        
        nodeExporter:
          enabled: true
        
        pushgateway:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
