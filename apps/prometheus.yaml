apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: "28.9.0"  # or whatever version you want
    helm:
      values: |
        server:
          persistentVolume:
            enabled: true
            size: 8Gi
            storageClass: longhorn-single
        alertmanager:
          enabled: true
        kubeStateMetrics:
          enabled: false
        nodeExporter:
          enabled: true
        pushgateway:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
