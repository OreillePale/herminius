apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voidauth
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/OreillePale/herminius
    targetRevision: main
    path: apps/voidauth

  destination:
    server: https://kubernetes.default.svc
    namespace: voidauth

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      #- ServerSideApply=true
