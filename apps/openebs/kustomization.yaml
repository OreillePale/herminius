helmCharts:
  - name: openebs
    repo: https://openebs.github.io/openebs
    releaseName: openebs
    namespace: openebs
    version: 4.4.0
    valuesInline:
      engines:
        local:
          enabled: false
        replicated:
          jiva:
            enabled: true
          mayastor:
            enabled: false
      backup:
        enabled: false
      monitoring:
        enabled: false
      loki:
        enabled: false

resources:
  - sc-jiva.yaml
  - sc-hostpath.yaml
