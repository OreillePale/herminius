helmCharts:
  - name: openebs
    repo: https://openebs.github.io/openebs
    releaseName: openebs
    namespace: openebs
    version: 4.4.0
    valuesInline:
      engines:
        local:
          enabled: true
        replicated:
          jiva:
            enabled: true
          mayastor:
            enabled: false
      backup:
        enabled: false      # disables MinIO
      monitoring:
        enabled: false      # disables Loki + Prometheus
      loki:
        enabled: false

  - name: jiva-operator
    repo: https://openebs.github.io/jiva-operator
    releaseName: jiva-operator
    namespace: openebs
    version: 3.6.0

resources:
  - sc-jiva.yaml
  - sc-hostpath.yaml
