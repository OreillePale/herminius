apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - app: autobrr
          - app: redis
          - app: nfs-csi
          - app: beszel
          - app: grimmory
          - app: gotify
          - app: pangolin
          - app: immich
          - app: argocd
          - app: arrstack
          - app: auth
          - app: bitwarden
          - app: influxdb
          - app: nativecloudpg
          - app: intel-igpu
          - app: tds-leaderboard

  template:
    metadata:
      name: "{{app}}"
    spec:
      project: default

      source:
        repoURL: https://github.com/OreillePale/herminius
        targetRevision: main
        path: "apps/{{app}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{app}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
