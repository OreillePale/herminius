resources:
  - external-secret.yaml

helmCharts:
  - name: telegraf-ds
    repo: https://helm.influxdata.com/
    releaseName: telegraf-ds
    version: "1.1.57"
    namespace: metrics
    valuesFile: telegraf-values.yaml 
    
  - name: telegraf
    repo: https://helm.influxdata.com/
    releaseName: telegraf-speedtest
    version: "1.8.78"
    namespace: metrics
    valuesFile: telegraf-speedtest.yaml

  - name: app-template
    version: 5.3.0
    repo: https://bjw-s-labs.github.io/helm-charts
    namespace: metrics
    releaseName: telegraf-intel-gpu-top
    valuesFile: telegraf-igt.yaml

  - name: influxdb2
    repo: https://helm.influxdata.com/
    version: "2.1.2"
    releaseName: influxdb2
    namespace: metrics
    valuesFile: influxdb3-values.yaml

  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: "14.0.1"
    releaseName: grafana
    namespace: metrics
    valuesFile: grafana-values.yaml
    
