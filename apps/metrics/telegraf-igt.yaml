# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.6.0/charts/other/app-template/values.schema.json
#
# bjw-s app-template values for telegraf-intel-gpu-top (Intel GPU -> Telegraf)
# igt.sh is baked into the image at /usr/local/bin/igt.sh.
# The secret (metrics-secret) is created separately, not stored here.

controllers:
  telegraf:
    type: daemonset
    pod:
      nodeSelector:
        gpu: intel
      tolerations:
        - key: gpu
          operator: Equal
          value: intel
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: reserved
          effect: NoSchedule
    containers:
      main:
        image:
          repository: oreillepale/telegraf-intel-gpu-top
          tag: 0.1.3
          pullPolicy: IfNotPresent
        # Bypass the image entrypoint: it drops to the "telegraf" user, and
        # intel_gpu_top needs root (or CAP_PERFMON) to read perf counters.
        command: ["telegraf"]
        args: ["--config", "/etc/telegraf/telegraf.conf"]
        env:
          NODENAME:
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        envFrom:
          - secretRef:
              name: metrics-secret
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
configMaps:
  config:
    data:
      telegraf.conf: |
        [agent]
          interval = "10s"
          flush_interval = "10s"
          hostname = "${NODENAME}"

        [[inputs.exec]]
          commands = ["/usr/local/bin/igt.sh"]
          timeout = "8s"
          data_format = "json"
          name_override = "intel_gpu"

        [[outputs.influxdb_v2]]
          urls = ["http://influxdb2.metrics.svc:8181"]
          token = "${TELEGRAF_TOKEN}"
          bucket = "telegraf"
          organization = "flickers"

persistence:
  config:
    type: configMap
    identifier: config
    advancedMounts:
      telegraf:
        main:
          - path: /etc/telegraf/telegraf.conf
            subPath: telegraf.conf
  dri:
    type: hostPath
    hostPath: /dev/dri
    advancedMounts:
      telegraf:
        main:
          - path: /dev/dri
