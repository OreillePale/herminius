replicaCount: 1

image:
  repo: "docker.io/library/telegraf"
  tag: "1.40-alpine"
  pullPolicy: IfNotPresent

deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []

args:
  - "--non-strict-env-handling"

initContainers: []

env:
  - name: HOSTNAME
    value: "telegraf-polling-service"

  - name: NODENAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

  - name: TELEGRAF_TOKEN
    valueFrom:
      secretKeyRef:
        name: metrics-secret
        key: TELEGRAF_TOKEN

resources: {}

nodeSelector: {}
affinity: {}
tolerations: []

# Expose Telegraf through a Kubernetes NodePort Service
service:
  enabled: true
  type: NodePort
  annotations: {}

config:
  agent:
    interval: "60s"
    round_interval: true
    metric_batch_size: 1000
    metric_buffer_limit: 10000
    collection_jitter: "0s"
    flush_interval: "60s"
    flush_jitter: "0s"
    precision: ""
    debug: false
    quiet: false
    logfile: ""
    hostname: "$NODENAME"
    omit_hostname: false

  processors:
    - enum:
        mapping:
          fields: ["status"]
          dest: "status_code"
          value_mappings:
            healthy: 1
            problem: 2
            critical: 3

  outputs:
    - influxdb_v2:
        urls:
          - "http://influxdb2.metrics.svc:8181"
        bucket: "telegraf"
        token: "$TELEGRAF_TOKEN"
        organization: "flickers"

  inputs:
    # Existing internet speed monitoring
    - internet_speed:
        interval: "1h"

    # TrueNAS Graphite metrics receiver
    - socket_listener:
        service_address: "tcp://:2003"
        data_format: "graphite"
        templates:
          - "measurement*"
