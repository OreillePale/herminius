apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otterwiki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OreillePale/herminius
    targetRevision: HEAD
    path: charts/singleimage
    helm:
      valueFiles:
        - ../../apps/otterwiki/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: otterwiki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true